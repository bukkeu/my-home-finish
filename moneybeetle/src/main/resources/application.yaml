# comment.
#   담당 : SCM (공통 기반·보안) / DB 접속 정보는 DBA 와 맞춘다
#   들어갈 내용
#   - spring.application.name : moneybeetle
#   - spring.datasource : MySQL 8 (DB money_beetle). 접속 정보는 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD 로 읽는다
#     로컬은 moneybeetle/.env (Git 제외, .env.example 복사) 또는 IntelliJ 실행 설정의 Environment variables 에 값을 넣는다
#     비밀 값(DB_PASSWORD)에는 기본값을 두지 않는다 -> 설정을 안 하면 서버가 뜨지 않아 바로 알 수 있다 (환경변수 문서 5-2)
#   - spring.jpa : ddl-auto none (resources/sql 스크립트로 테이블 생성), show-sql·format_sql 은 local 프로필에서만 (맨 아래 구역, #114)
#   - server.servlet.session.timeout : 30m (DP-11)
#   - spring.servlet.multipart : max-file-size 500MB(강의 영상, DP-33), max-request-size 510MB. 프로필 이미지 2MB(DP-32)는 FileStorageService 가 용도별로 검사
#   - jackson 시간대 : Asia/Seoul (DP-42)

spring:
  application:
    name: moneybeetle
  config:
    import: optional:file:.env[.properties]   # 실행 위치(moneybeetle/)의 .env 를 읽는다. 없으면 건너뛴다
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}                       # 필수, 기본값 없음 (환경변수 문서 2-1·5-2, #114). 값은 .env.example 참고
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}   # .env 의 SPRING_PROFILES_ACTIVE=local 을 실행 프로필로 쓴다 (OS 환경변수가 있으면 그쪽이 먼저)
  jpa:
    show-sql: false                      # SQL 로그는 local 프로필에서만 켠다 (아래 local 구역, 환경변수 문서 4)
    database: mysql
    hibernate:
      ddl-auto: none
  jackson:
    time-zone: Asia/Seoul
  # 비밀번호 재설정 메일 (#8). 로컬은 1025 포트의 메일 확인 도구를 쓴다. 비밀번호는 환경변수로만 받는다 (환경변수 문서 2-2)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 메일 서버가 응답하지 않아도 발송 스레드(2개)가 무기한 묶이지 않도록 SMTP 연결·읽기·쓰기 제한 시간(ms)을 둔다
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
server:
  servlet:
    session:
      timeout: 30m
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
app:
  # 메일 속 링크의 주소(재설정 화면)와 발신자 주소
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@moneybeetle.local}

---
# local 프로필 (각자 노트북·발표 노트북). .env 의 SPRING_PROFILES_ACTIVE=local 이면 켜진다 (#114, 환경변수 문서 4)
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
