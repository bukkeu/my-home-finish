# comment.
#   담당 : SCM (회원·공통) / DB 접속 정보는 DBA 와 맞춘다
#   들어갈 내용
#   - spring.application.name : moneybeetle
#   - spring.datasource : MySQL 8 (url jdbc:mysql://localhost:3306/money_beetle, username, password)
#   - spring.jpa : ddl-auto none (resources/sql 스크립트로 테이블 생성), show-sql, format_sql
#   - server.servlet.session.timeout : 30m (DP-11)
#   - spring.servlet.multipart : 파일 업로드 최대 크기 500MB (영상 기준, DP-33) / 이미지 2MB는 FileStorageService에서 검사 (DP-32)
#   - jackson 시간대 : Asia/Seoul (DP-42)

spring:
  application:
    name: moneybeetle
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/money_beetle?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: wanted
    password: wanted
  jpa:
    show-sql: true
    database: mysql
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
server:
  servlet:
    session:
      timeout: 30m
file:
  upload-dir: ./uploads