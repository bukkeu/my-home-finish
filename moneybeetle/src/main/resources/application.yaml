# comment.
#   담당 : SCM (공통 기반·보안) / DB 접속 정보는 DBA 와 맞춘다
#   들어갈 내용
#   - spring.application.name : moneybeetle
#   - spring.datasource : MySQL 8 (DB money_beetle). 접속 정보는 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD 로 읽는다
#     로컬은 moneybeetle/.env (Git 제외, .env.example 복사) 또는 IntelliJ 실행 설정의 Environment variables 에 값을 넣는다
#     비밀 값(DB_PASSWORD)에는 기본값을 두지 않는다 -> 설정을 안 하면 서버가 뜨지 않아 바로 알 수 있다 (환경변수 문서 5-2)
#   - spring.jpa : ddl-auto none (resources/sql 스크립트로 테이블 생성), show-sql·format_sql 은 local 프로필에서만 (맨 아래 구역, #114)
#   - server.servlet.session.timeout : 30m (DP-11)
#   - spring.servlet.multipart : max-file-size 500MB(강의 영상, DP-33), max-request-size 510MB. 프로필 이미지 2MB(DP-32)는 FileStorageService 가 용도별로 검사
#   - jackson 시간대 : Asia/Seoul (DP-42)

spring:
  application:
    name: moneybeetle
  config:
    import: optional:file:.env[.properties]   # 실행 위치(moneybeetle/)의 .env 를 읽는다. 없으면 건너뛴다
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}                       # 필수, 기본값 없음 (환경변수 문서 2-1·5-2, #114). 값은 .env.example 참고
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}   # .env 의 SPRING_PROFILES_ACTIVE=local 을 실행 프로필로 쓴다 (OS 환경변수가 있으면 그쪽이 먼저)
  jpa:
    show-sql: false                      # SQL 로그는 local 프로필에서만 켠다 (아래 local 구역, 환경변수 문서 4)
    database: mysql
    hibernate:
      ddl-auto: none
  jackson:
    time-zone: Asia/Seoul
  # 비밀번호 재설정 메일 (#8). 로컬은 1025 포트의 메일 확인 도구를 쓴다. 비밀번호는 환경변수로만 받는다 (환경변수 문서 2-2)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    # 메일 서버가 응답하지 않아도 발송 스레드(2개)가 무기한 묶이지 않도록 SMTP 연결·읽기·쓰기 제한 시간(ms)을 둔다
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
server:
  servlet:
    session:
      timeout: 30m
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
app:
  # 메일 속 링크의 주소(재설정 화면)와 발신자 주소
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@moneybeetle.local}

# 서버 상태 확인 (#84, 시스템 설계 "모니터링") : health·info 만 웹으로 연다. 나머지(env, beans, …)는 열지 않는다
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never              # DB·디스크 같은 내부 정보는 보여 주지 않고 UP/DOWN 만
  health:
    mail:
      enabled: false                   # 메일(비밀번호 재설정)은 로컬에 메일 도구가 없어도 서버는 정상이라 상태 확인에서 뺀다. DB 는 확인한다
  info:
    env:
      enabled: true                    # 아래 info.* 값을 /actuator/info 로 보여 준다
info:
  app:
    name: moneybeetle
    description: 경제 학습 + 모의투자 + 모의 청약 (로컬 발표용)

# 로그 (#84) : 요청마다 요청 ID(requestId)를 붙인다 (RequestLogFilter, 시스템 설계 "로그", EP-05)
#  - 비밀번호·세션 ID·토큰은 남기지 않는다 : 요청 로그는 주소의 경로만 남기고(?token= 같은 쿼리와 ;jsessionid= 같은 경로 매개변수는 뺀다),
#    요청 본문·파라미터 값은 로그에 쓰지 않는다. Hibernate 바인딩 값(TRACE)·spring.mvc.log-request-details 는 켜지 않는다
logging:
  pattern:
    correlation: "[%X{requestId:-}|m=%X{memberId:-}] "   # 콘솔 한 줄마다 [요청 ID|m=회원 ID]. 회원 ID 는 요청 로그 줄에 붙는다(비로그인은 빈칸)
  level:
    root: INFO
    com.wanted.moneybeetle: INFO

---
# local 프로필 (각자 노트북·발표 노트북). .env 의 SPRING_PROFILES_ACTIVE=local 이면 켜진다 (#114, 환경변수 문서 4)
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # 요청(세션)마다 실행한 쿼리 수·시간을 로그에 남긴다 (#285 리팩토링 전후 수치 비교, 코드 점검표 R-1). local 에서만
        generate_statistics: true
# local 로그 (#84) : 우리 코드는 DEBUG 까지, 파일은 logs/moneybeetle.log 에 JSON 한 줄씩(요청 ID·회원 ID 포함), 7일 보관
logging:
  level:
    com.wanted.moneybeetle: DEBUG
  file:
    name: logs/moneybeetle.log
  structured:
    format:
      file: logstash
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
