<!--/* comment.
    담당 : DBA ① 신아림 (#253, 강의 운영 탭 - #34 카테고리, #35 강의 검수·공개 관리)
    원본 디자인 : moneybeetle-page/AdminDashboard.dc.html 의 review·courses·categories 보기
    경로 : /admin/dashboard?view=courses (&tab=review|all|categories, 없으면 review)
    내용 : 검수 대기(목록 + 상세 확인 후 허가·반려) / 전체 강의(상태별, 공개·비공개, 삭제) / 카테고리(등록·수정·삭제)
    데이터 : static/js/admin-courses.js (API 85~94). 요소는 data-ao-… 로 찾는다
*/-->
<link rel="stylesheet" type="text/css" th:href="@{/css/admin-ops.css}">
<section class="ao" id="ao-courses" data-ao-courses>
  <div class="ao-toolbar">
    <div class="adm-seg" role="tablist" aria-label="강의 운영 메뉴">
      <button type="button" role="tab" id="ao-tab-review" aria-controls="ao-pane-review" data-ao-tab="review" aria-selected="true">검수 대기<span class="ao-count" data-ao-review-count hidden></span></button>
      <button type="button" role="tab" id="ao-tab-all" aria-controls="ao-pane-all" data-ao-tab="all" aria-selected="false" tabindex="-1">전체 강의</button>
      <button type="button" role="tab" id="ao-tab-categories" aria-controls="ao-pane-categories" data-ao-tab="categories" aria-selected="false" tabindex="-1">카테고리</button>
    </div>
  </div>

  <div data-ao-pane="review" role="tabpanel" id="ao-pane-review" aria-labelledby="ao-tab-review">
    <div class="ao-review">
      <div class="adm-box ao-queue" aria-label="검수 대기 강의" data-ao-queue>
        <p class="adm-empty">불러오고 있어요…</p>
      </div>
      <div class="adm-box ao-detail" data-ao-detail aria-live="polite">
        <p class="adm-empty">왼쪽에서 검수할 강의를 골라 주세요.</p>
      </div>
    </div>
  </div>

  <div data-ao-pane="all" role="tabpanel" id="ao-pane-all" aria-labelledby="ao-tab-all" hidden>
    <div class="ao" data-ao-all>
      <div class="ao-toolbar">
        <label class="adm-field">상태
          <select class="adm-select" data-ao-status aria-label="강의 상태">
            <option value="">전체</option>
            <option value="REVIEW">검수 중</option>
            <option value="APPROVED">허가</option>
            <option value="REJECTED">반려</option>
            <option value="DRAFT">작성 중</option>
          </select>
        </label>
      </div>
      <div data-ao-list><p class="adm-empty">불러오고 있어요…</p></div>
      <p class="adm-note">공개·비공개는 허가된 강의만 바꿀 수 있어요. 시청·학습 기록이 있는 강의는 삭제할 수 없고 비공개로만 바꿀 수 있어요.</p>
    </div>
  </div>

  <div data-ao-pane="categories" role="tabpanel" id="ao-pane-categories" aria-labelledby="ao-tab-categories" hidden>
    <div class="ao" data-ao-cats-root>
      <div class="ao-cats" data-ao-cats><p class="adm-empty">불러오고 있어요…</p></div>
      <div class="adm-box">
        <h2>카테고리 추가</h2>
        <div class="ao-add">
          <input class="adm-input" type="text" maxlength="30" placeholder="카테고리 이름" aria-label="새 카테고리 이름" data-ao-new-name>
          <input class="adm-input" type="number" min="0" step="1" placeholder="순서" aria-label="새 카테고리 순서" data-ao-new-order>
          <button type="button" class="btn btn-primary" data-ao-new-save>추가</button>
        </div>
        <span class="adm-error" role="alert" data-ao-new-error></span>
      </div>
      <p class="adm-note">이름은 사용자 사이드바의 '강의' 메뉴에 그대로 보여요. 강의나 소주제가 연결된 카테고리는 삭제하면 지워지지 않고 '사용 안 함'으로 바뀌어요.</p>
    </div>
  </div>
</section>
