    경로 : /admin/dashboard?view=settings

<section class="adm-box">
  <h2>서비스 설정</h2>
  <p class="adm-note">해금 레벨, 퀴즈 통과 점수, 로그인 잠금 같은 값이에요. 항목마다 저장하고, 저장하면 작업 기록이 남아요</p>
  <div class="adm-rows" id="adm-settings"><p class="adm-empty">불러오고 있어요…</p></div>
</section>

<section class="adm-col" id="log">
  <h2>관리자 작업 기록</h2>
  <div class="adm-filters">
    <label class="adm-field">대상 종류
      <input class="adm-input" id="adm-log-type" type="text" maxlength="30" placeholder="예) SEASON, MEMBER" style="width: 180px">
    </label>
    <label class="adm-field">시작일
      <input class="adm-input" id="adm-log-from" type="date">
    </label>
    <label class="adm-field">종료일
      <input class="adm-input" id="adm-log-to" type="date">
    </label>
    <button type="button" class="btn btn-secondary" id="adm-log-search">조회</button>
  </div>
  <div class="adm-table" id="adm-logs" aria-label="관리자 작업 기록"><p class="adm-empty">불러오고 있어요…</p></div>
  <div class="adm-actions" style="justify-content: center">
    <button type="button" class="btn btn-secondary" id="adm-log-more" hidden>더 보기</button>
  </div>
</section>
