<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>마이페이지 성장 탭 조각</title>
</head>
<body>
<!--/* comment.
    담당 : DBA ② 김예린 (#69, 성장·캐시 내역 탭)
    내용 : 마이페이지 - 캐시 내역, 경험치 내역, 레벨·칭호 표 (청약통장은 이 탭이 아니라 housing 탭에서 다룬다, #70)
    경로 : /user/my-page#growth
    원본 디자인 : moneybeetle-page/UserMyPage.dc.html 의 "캐시 내역" 탭 (내 레벨·경험치·수상 내역·사진은 틀 #54 의 프로필 카드가 보여 주므로 이 탭에 두지 않는다)

    사용 (마이페이지 틀 member/mypage.html):
        틀 member/mypage.html 이 th:insert 로 부른다 (fragments/mypage/growth :: growthTabFragment, 주소 끝 #growth)
    - 이 조각 안의 <link>(mypage-mg.css)와 <script>(mypage-growth.js)가 스타일·데이터 불러오기를 맡는다. 틀은 탭 전환만 하면 된다.
    - class·id 는 모두 mg- 로 시작한다 (설정 탭과 같은 접두어. 청약통장 mh-, 학습 ml- 과 겹치지 않는다).
    데이터 (모두 로그인한 회원 본인의 값):
        GET /api/v1/members/me                    API 13 : 보유 캐시, 지금 레벨(레벨 표에서 내 줄을 표시)
        GET /api/v1/members/me/cash-histories     API 22 : 캐시 적립·사용 내역 (이번 달 합계도 이 값으로 계산)
        GET /api/v1/members/me/exp-histories      API 23 : 최근 경험치 내역
        GET /api/v1/levels                        API 24 : 레벨·칭호 표
*/-->
<th:block th:fragment="growthTabFragment">
  <link rel="stylesheet" th:href="@{/css/mypage-mg.css}">
  <div class="mg mg-growth" id="mg-growth">
    <p class="mg-status" id="mg-growth-status" role="status" aria-live="polite">불러오고 있어요…</p>

    <!--/* ===== 캐시 내역 ===== */-->
    <section class="mg-sec" aria-labelledby="mg-cash-title">
      <h2 id="mg-cash-title">캐시 내역</h2>
      <div class="mg-stats">
        <div class="card blueprint">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <span class="mg-stat__label">보유 캐시</span>
          <span class="mg-stat__value"><img th:src="@{/images/cash-coin.png}" alt="캐시"><span id="mg-cash">-</span></span>
        </div>
        <div class="card blueprint mg-stat--in">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <span class="mg-stat__label">이번 달 적립</span>
          <span class="mg-stat__value" id="mg-cash-in">-</span>
        </div>
        <div class="card blueprint mg-stat--out">
          <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
          <span class="mg-stat__label">이번 달 사용</span>
          <span class="mg-stat__value" id="mg-cash-out">-</span>
        </div>
      </div>
      <div class="mg-filters" role="group" aria-label="캐시 내역 종류">
        <button type="button" class="mg-filter" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="mg-filter" data-filter="EARN" aria-pressed="false">적립</button>
        <button type="button" class="mg-filter" data-filter="USE" aria-pressed="false">사용</button>
      </div>
      <div class="card blueprint mg-list" id="mg-cash-list">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
      <div class="mg-actions"><button type="button" class="btn btn-secondary" id="mg-cash-more" hidden>더 보기</button></div>
    </section>

    <!--/* ===== 경험치 내역·레벨 표 (내 레벨·경험치 요약은 틀의 프로필 카드가 보여 준다) ===== */-->
    <section class="mg-sec" aria-labelledby="mg-level-title">
      <h2 id="mg-level-title">경험치 내역·레벨 표</h2>
      <div class="card blueprint mg-levels" tabindex="0" role="region" aria-label="레벨·칭호 표">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <table class="mg-table">
          <caption class="mg-help mg-caption">레벨·칭호 표</caption>
          <thead><tr><th>레벨</th><th>칭호</th><th class="num">필요 경험치</th><th class="num">레벨업 캐시</th><th>열리는 기능</th></tr></thead>
          <tbody id="mg-level-table"></tbody>
        </table>
      </div>
      <div class="card blueprint mg-list" id="mg-exp-list">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      </div>
    </section>

  </div>
  <script th:src="@{/js/mypage-growth.js}" defer></script>
</th:block>
</body>
</html>
