<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>사이드바 조각</title>
</head>
<body>
<!--/* comment.
    담당 : DBA ② (공통 레이아웃, 이슈 #49)
    내용 : 햄버거 메뉴(Drawer) - 프로필, 출석, 경험치, 메뉴. 역할별로 메뉴가 다르다 (sec:authorize)
           학습자(MEMBER) / 강사(INSTRUCTOR) = 왼쪽에서 열리는 Drawer, 관리자(ADMIN) = 고정 사이드바(모바일에서는 Drawer)
    경로 : 모든 화면
    사용 : <th:block th:replace="~{fragments/layout/sidebar :: sidebarFragment('home')}"></th:block>
           매개변수 active = 지금 보고 있는 메뉴 이름(home, lectures, trading, housing, my, inquiry, mypage ...)

    권한 이름: 수업(10_Spring-Security)처럼 hasAuthority('이름') 으로 검사한다.
    SecurityConfig(#4)가 로그인한 회원에게 MEMBER / INSTRUCTOR / ADMIN 권한을 이 이름 그대로(ROLE_ 접두어 없이) 부여해야 한다.
*/-->

<th:block th:fragment="sidebarFragment(active)"
          th:with="lv=${layout != null ? layout.level : 1},
                   trade=${layout != null ? layout.unlockTradingLevel : 8},
                   house=${layout != null ? layout.unlockHousingLevel : 12}">

    <!--/* ===== 학습자 Drawer (HOM-03) ===== */-->
    <th:block sec:authorize="hasAuthority('MEMBER')">
        <div class="mb-overlay" data-mb-overlay data-open="false" aria-hidden="true"></div>
        <aside class="mb-drawer" data-mb-drawer data-open="false" aria-hidden="true" aria-label="메뉴">
            <div class="mb-drawer__top">
                <a th:href="@{/user/home}"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
                <button type="button" class="mb-close" data-mb-close aria-label="메뉴 닫기">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
            </div>

            <!--/* 프로필 카드: 닉네임, 레벨·칭호, 캐시, 경험치, 연속 출석 */-->
            <div class="mb-profile-card" th:if="${layout != null}">
                <div class="mb-profile-card__who">
                    <span class="mb-avatar" th:text="${layout.initial}">?</span>
                    <div class="mb-profile-card__name">
                        <span th:text="${layout.nickname}">닉네임</span>
                        <span class="mb-profile-card__meta">
                            Lv.<span th:text="${layout.level}">1</span>
                            <span class="mb-house" th:text="${layout.tierName}">고시원</span>
                            <img th:src="@{/images/cash-coin.png}" alt="캐시"><span th:text="${#numbers.formatInteger(layout.cash, 0, 'COMMA')}">0</span>
                        </span>
                    </div>
                </div>
                <div class="mb-xp">
                    <div class="mb-xp__row"><span>경험치</span><span th:text="|${layout.expInLevel} / ${layout.expPerLevel} XP|">0 / 150 XP</span></div>
                    <div class="mb-xp__bar"><i th:style="|width:${layout.expPercent}%|"></i></div>
                    <span class="mb-xp__next" th:if="${layout.level < 20}">
                        Lv.<span th:text="${layout.level + 1}">2</span> 달성 시 <img th:src="@{/images/cash-coin.png}" alt="캐시"><span th:text="${#numbers.formatInteger(layout.nextLevelCash, 0, 'COMMA')}">0</span> 지급
                    </span>
                </div>
                <div class="mb-streak">
                    <b th:text="|연속 출석 ${layout.attendanceStreak}일|">연속 출석 0일</b>
                    <span th:text="${layout.attendanceHint}">5일째부터 캐시 지급</span>
                </div>
            </div>

            <nav class="mb-nav" aria-label="학습자 메뉴">
                <a th:href="@{/user/home}" th:classappend="${active == 'home'} ? 'is-active'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>홈</a>

                <button type="button" class="mb-nav__group" data-mb-toggle aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
                    <span>강의</span><span class="mb-caret" aria-hidden="true">▾</span></button>
                <div class="mb-nav__sub" hidden>
                    <a th:href="@{/user/lectures(cat=money)}">자본 증식</a>
                    <a th:href="@{/user/lectures(cat=estate)}">부동산</a>
                </div>

                <button type="button" class="mb-nav__group" data-mb-toggle aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="m7 15 4-4 3 3 6-6"></path></svg>
                    <span>트레이닝</span><span class="mb-caret" aria-hidden="true">▾</span></button>
                <div class="mb-nav__sub" hidden>
                    <!--/* 잠금 표시(NFR-09): 레벨이 모자라면 흐리게 하고 필요한 레벨을 보여 준다. 실제 차단은 서버(LevelCheckInterceptor)가 한다 */-->
                    <a th:href="@{/user/demo-trading}" th:classappend="${lv < trade} ? 'mb-locked'" th:attr="data-mb-lock=${lv < trade ? trade : null}">
                        <img th:if="${lv < trade}" th:src="@{/images/lock.png}" alt="잠김">
                        <span>모의 투자</span><small th:if="${lv < trade}" th:text="|· Lv.${trade}부터|">· Lv.8부터</small></a>
                    <a th:href="@{/user/demo-housing-subscription}" th:classappend="${lv < house} ? 'mb-locked'" th:attr="data-mb-lock=${lv < house ? house : null}">
                        <img th:if="${lv < house}" th:src="@{/images/lock.png}" alt="잠김">
                        <span>모의 청약</span><small th:if="${lv < house}" th:text="|· Lv.${house}부터|">· Lv.12부터</small></a>
                </div>

                <button type="button" class="mb-nav__group" data-mb-toggle aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                    <span>내 학습</span><span class="mb-caret" aria-hidden="true">▾</span></button>
                <div class="mb-nav__sub" hidden>
                    <a th:href="@{/user/my-page(tab='wrong')}">퀴즈 오답노트</a>
                    <a th:href="@{/user/my-page(tab='scrap')}">강의 스크랩</a>
                    <a th:href="@{/user/my-page(tab='learning')}">시청기록 · 학습완료</a>
                </div>

                <a th:href="@{/user/inquiry}" th:classappend="${active == 'inquiry'} ? 'is-active'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>문의 게시판</a>
                <a th:href="@{/user/my-page}" th:classappend="${active == 'mypage'} ? 'is-active'">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>마이페이지</a>
            </nav>

            <!--/* 로그아웃은 POST 이므로 form 이다. th:action 이 CSRF 토큰을 자동으로 넣는다 */-->
            <form th:action="@{/api/v1/auth/logout}" method="post" class="mb-nav">
                <button type="submit" class="mb-nav__group">로그아웃</button>
            </form>
        </aside>
    </th:block>

    <!--/* ===== 강사 Drawer ===== */-->
    <th:block sec:authorize="hasAuthority('INSTRUCTOR')">
        <div class="mb-overlay" data-mb-overlay data-open="false" aria-hidden="true"></div>
        <aside class="mb-drawer" data-mb-drawer data-open="false" aria-hidden="true" aria-label="강사 메뉴">
            <div class="mb-drawer__top">
                <a th:href="@{/instructor/dashboard}"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
                <button type="button" class="mb-close" data-mb-close aria-label="메뉴 닫기">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                </button>
            </div>
            <div class="mb-profile-card" th:if="${layout != null}">
                <div class="mb-profile-card__who">
                    <span class="mb-avatar" th:text="${layout.initial}">?</span>
                    <div class="mb-profile-card__name"><span th:text="|${layout.nickname} 강사|">강사</span></div>
                </div>
            </div>
            <nav class="mb-nav" aria-label="강사 메뉴">
                <span class="mb-nav__label">강사 센터</span>
                <a th:href="@{/instructor/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'">대시보드</a>
                <a th:href="@{/instructor/dashboard(tab='courses')}" th:classappend="${active == 'courses'} ? 'is-active'">강의 관리</a>
                <a th:href="@{/instructor/course-create}" th:classappend="${active == 'course-create'} ? 'is-active'">강의 생성</a>
                <a th:href="@{/instructor/dashboard(tab='qna')}" th:classappend="${active == 'qna'} ? 'is-active'">Q&amp;A 관리</a>
                <a th:href="@{/instructor/dashboard(tab='mypage')}" th:classappend="${active == 'mypage'} ? 'is-active'">마이페이지</a>
                <a th:href="@{/user/home}">← 수강생 화면으로</a>
            </nav>
            <form th:action="@{/api/v1/auth/logout}" method="post" class="mb-nav">
                <button type="submit" class="mb-nav__group">로그아웃</button>
            </form>
        </aside>
    </th:block>

    <!--/* ===== 관리자 고정 사이드바 (모바일에서는 Drawer 처럼 열린다) ===== */-->
    <th:block sec:authorize="hasAuthority('ADMIN')">
        <div class="mb-overlay" data-mb-overlay data-open="false" aria-hidden="true"></div>
        <aside class="mb-admin-side" data-mb-drawer data-mb-pinned data-open="false" aria-label="관리자 메뉴">
            <div class="mb-admin-side__brand">
                <a th:href="@{/admin/dashboard}"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
            </div>
            <div class="mb-admin-side__who" th:if="${layout != null}">
                <b th:text="${layout.nickname}">관리자</b>관리자 · 전체 권한
            </div>
            <nav class="mb-nav" aria-label="관리자 메뉴">
                <a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'">대시보드</a>
                <a th:href="@{/admin/dashboard(view='courses')}" th:classappend="${active == 'courses'} ? 'is-active'">강의 운영</a>
                <a th:href="@{/admin/dashboard(view='terms')}" th:classappend="${active == 'terms'} ? 'is-active'">홈 콘텐츠</a>
                <span class="mb-nav__label">트레이닝 운영</span>
                <a th:href="@{/admin/trading-management}" th:classappend="${active == 'trading'} ? 'is-active'">모의투자</a>
                <a th:href="@{/admin/housing-management}" th:classappend="${active == 'housing'} ? 'is-active'">모의 청약</a>
                <a th:href="@{/admin/dashboard(view='growth')}" th:classappend="${active == 'growth'} ? 'is-active'">성장·캐시</a>
                <span class="mb-nav__label">회원·게시판</span>
                <a th:href="@{/admin/dashboard(view='members')}" th:classappend="${active == 'members'} ? 'is-active'">회원·강사</a>
                <a th:href="@{/admin/dashboard(view='board')}" th:classappend="${active == 'board'} ? 'is-active'">문의 게시판</a>
                <a th:href="@{/admin/dashboard(view='settings')}" th:classappend="${active == 'settings'} ? 'is-active'">설정·작업 기록</a>
            </nav>
            <form th:action="@{/api/v1/auth/logout}" method="post" class="mb-nav">
                <button type="submit" class="mb-nav__group">로그아웃</button>
            </form>
        </aside>
    </th:block>
</th:block>
</body>
</html>
