<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <th:block th:replace="~{fragments/layout/header :: headFragment('강사 로그인')}"></th:block>
  <link rel="stylesheet" type="text/css" th:href="@{/css/instructor.css}">
</head>
<body class="ins-auth-body">
<!--/* comment.
  담당 : DBA ① 신아림 (#59, 강사 로그인 화면)
  원본 디자인 : InstructorLogin.dc.html (화면설계 5.1.4)
  경로 : /instructor/login (누구나)
  데이터 : POST /api/v1/auth/login (폼 형식 + CSRF, API 6). 응답의 role 이 INSTRUCTOR 일 때만 강사 대시보드로 보낸다
  - 승인 전 강사·학생 계정은 MEMBER 로 로그인되므로(SP-07) 바로 로그아웃하고 안내한다 (강사 화면에 들어오지 못하게)
  - '로그인 상태 유지'·'비밀번호 찾기'는 서버 기능이 없어 시안에서 뺐다
*/-->
<div class="ins-auth ins-auth--login">
  <main class="ins-auth__card ins-auth__card--login">
    <a class="ins-auth__logo" th:href="@{/}"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
    <span class="ins-kicker">강사 센터</span>
    <h1>강사 로그인</h1>
    <p class="ins-auth__sub">처음이신가요? <a th:href="@{/instructor/signup}">강사 회원가입</a></p>
    <form class="ins-form" data-ins-login novalidate>
      <label class="ins-field">
        <span>강사 계정 이메일</span>
        <input class="ins-input" type="email" name="email" autocomplete="username" placeholder="teacher@moneybeetle.kr" required>
      </label>
      <label class="ins-field">
        <span>비밀번호</span>
        <span class="ins-pw">
          <input class="ins-input" type="password" name="password" autocomplete="current-password" placeholder="비밀번호" required>
          <button type="button" class="ins-pw__toggle" data-ins-pw-toggle aria-pressed="false">보기</button>
        </span>
      </label>
      <p class="ins-error" role="alert" data-ins-error></p>
      <button type="submit" class="btn btn-primary ins-submit">로그인</button>
    </form>
    <p class="ins-auth__note">강사 로그인은 이메일과 비밀번호로만 할 수 있어요.<br>관리자가 강사 권한을 승인한 계정만 강사 화면에 들어올 수 있어요.</p>
    <p class="ins-auth__sub">학생이신가요? <a th:href="@{/login}">학생 로그인</a></p>
  </main>
</div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/instructor-login.js}"></script>
</body>
</html>
