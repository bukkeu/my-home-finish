<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout/header :: headFragment('로그인')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-main">
  <div class="auth-top">
    <a class="auth-brand" th:href="@{/}" aria-label="머니비틀 홈"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
    <a class="auth-close" th:href="@{/}" aria-label="닫기"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
  </div>
  <div class="auth-body">
    <span class="auth-eyebrow">학생 로그인</span>
    <h1 id="login-title">로그인</h1>
    <p class="auth-sub">처음이신가요? <a th:href="@{/signup}">회원가입</a></p>
    <form id="login-form" class="auth-form" aria-labelledby="login-title" novalidate>
      <input type="hidden" name="next" id="login-next">
      <label for="login-email">이메일</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required maxlength="100" placeholder="beetle@example.com">
      <label for="login-password">비밀번호</label>
      <div class="auth-password">
        <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="비밀번호">
        <button type="button" data-password-toggle="login-password" aria-label="비밀번호 표시">보기</button>
      </div>
      <p class="auth-message" id="login-message" role="alert" aria-live="polite"></p>
      <div class="auth-links">
        <a th:href="@{/login(view='find-email')}">이메일 찾기</a>
        <a th:href="@{/password-reset}">비밀번호 재설정</a>
      </div>
      <button class="auth-button auth-button--primary" type="submit">로그인</button>
    </form>
    <div th:if="${googleOAuthEnabled} or ${kakaoOAuthEnabled}">
      <div class="auth-divider">또는 간편하게 로그인</div>
      <div class="auth-social">
        <a class="auth-button auth-button--google" th:if="${googleOAuthEnabled}" th:href="@{/api/v1/auth/oauth/google}"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Google로 계속하기</a>
        <a class="auth-button auth-button--kakao" th:if="${kakaoOAuthEnabled}" th:href="@{/api/v1/auth/oauth/kakao}"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191919" d="M12 3C6.48 3 2 6.54 2 10.9c0 2.83 1.88 5.3 4.7 6.7-.2.74-.75 2.7-.86 3.12-.13.52.19.51.4.37.17-.11 2.62-1.78 3.68-2.5.67.1 1.37.15 2.08.15 5.52 0 10-3.54 10-7.9S17.52 3 12 3z"/></svg>카카오로 계속하기</a>
      </div>
    </div>
  </div>
</main>
<div class="auth-footer"><b>안내</b><span>모든 투자·청약 화면은 가상 실습이며 실제 금융 거래가 아니에요</span></div>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
