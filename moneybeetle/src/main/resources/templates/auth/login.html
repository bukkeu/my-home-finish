<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout/header :: headFragment('로그인')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page" data-auth-page="login">
<main class="auth-main">
    <a class="auth-brand" th:href="@{/}" aria-label="머니비틀 홈"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
    <section class="auth-card" aria-labelledby="login-title">
        <span class="auth-eyebrow">학생 로그인</span>
        <h1 id="login-title">다시 만나 반가워요</h1>
        <p class="auth-lead">머니비틀에서 오늘의 경제 공부를 이어가요.</p>
        <form id="login-form" class="auth-form" novalidate>
            <input type="hidden" name="next" id="login-next">
            <label for="login-email">이메일</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required maxlength="100" placeholder="beetle@example.com">
            <label for="login-password">비밀번호</label>
            <div class="auth-password">
                <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                <button type="button" data-password-toggle="login-password" aria-label="비밀번호 표시">보기</button>
            </div>
            <p class="auth-message" id="login-message" role="alert" aria-live="polite"></p>
            <div class="auth-links auth-links--split">
                <a th:href="@{/login(view='find-email')}">이메일 찾기</a>
                <a th:href="@{/password-reset}">비밀번호 재설정</a>
            </div>
            <button class="auth-button auth-button--primary" type="submit">로그인</button>
        </form>
        <div class="auth-divider"><span>또는 간편 로그인</span></div>
        <div class="auth-social">
            <a class="auth-button auth-button--google" th:if="${googleOAuthEnabled}" th:href="@{/api/v1/auth/oauth/google}"><span aria-hidden="true">G</span>Google로 계속하기</a>
            <a class="auth-button auth-button--kakao" th:if="${kakaoOAuthEnabled}" th:href="@{/api/v1/auth/oauth/kakao}"><span aria-hidden="true">●</span>카카오로 계속하기</a>
        </div>
        <p class="auth-bottom">처음이신가요? <a th:href="@{/signup}">회원가입</a></p>
    </section>
</main>
<footer class="auth-footer">모든 투자·청약 화면은 가상 실습이며 실제 금융 거래가 아니에요.</footer>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
