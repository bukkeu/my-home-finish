<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout/header :: headFragment('비밀번호 재설정')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page" data-auth-page="password-reset">
<main class="auth-main">
  <div class="auth-top">
    <a class="auth-brand" th:href="@{/}" aria-label="머니비틀 홈"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
    <a class="auth-close" th:href="@{/}" aria-label="닫기"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
  </div>
  <div class="auth-body">
    <span class="auth-eyebrow">계정 찾기</span>
    <h1 id="reset-title">비밀번호 재설정</h1>
    <p class="auth-lead">가입한 이메일로 재설정 링크를 보내드릴게요.</p>
    <form id="reset-request-form" class="auth-form" aria-labelledby="reset-title" novalidate>
      <label for="reset-email">이메일</label>
      <input id="reset-email" type="email" required maxlength="100" autocomplete="email" placeholder="beetle@example.com">
      <p class="auth-message" id="reset-request-message" role="status" aria-live="polite"></p>
      <button class="auth-button auth-button--primary" type="submit">재설정 링크 받기</button>
    </form>
    <form id="reset-confirm-form" class="auth-form" aria-labelledby="reset-title" hidden novalidate>
      <p class="auth-hint">메일로 받은 링크에서 계속 진행해 주세요. 링크는 10분 동안 유효해요.</p>
      <label for="reset-password">새 비밀번호</label>
      <div class="auth-password">
        <input id="reset-password" type="password" minlength="8" maxlength="20" autocomplete="new-password" required>
        <button type="button" data-password-toggle="reset-password" aria-label="비밀번호 표시">보기</button>
      </div>
      <label for="reset-password-confirm">새 비밀번호 확인</label>
      <input id="reset-password-confirm" type="password" minlength="8" maxlength="20" autocomplete="new-password" required>
      <p class="auth-message" id="reset-confirm-message" role="alert" aria-live="polite"></p>
      <button class="auth-button auth-button--primary" type="submit">비밀번호 변경</button>
    </form>
    <p class="auth-bottom"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
  </div>
</main>
<div class="auth-footer"><b>안내</b><span>모든 투자·청약 화면은 가상 실습이며 실제 금융 거래가 아니에요</span></div>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
