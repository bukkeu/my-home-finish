<body>
<!--/* comment.
  담당 : DBA ① 신아림 (#52 강의 상세·영상 시청, #53 테스트 퀴즈·최종 퀴즈·결과)
  원본 디자인 : UserLectureDetail.dc.html (화면설계 5.2.4)
  경로 : /user/lecture-detail?courseId=
  데이터 : GET /api/v1/courses/{courseId} (강의·영상·요약글·내 진행), GET /api/v1/categories (경로 표시),
      GET /api/v1/courses/{courseId}/lessons/{lessonId} (영상 주소·이어보기 위치),
      PUT .../progress (시청 위치 저장), POST·DELETE /api/v1/courses/{courseId}/scrap (스크랩)
      GET·POST /api/v1/courses/{courseId}/test-quiz(/grade) (시청 전 테스트), GET /quiz·POST /quiz/attempts (최종 퀴즈, #53)
  - 이어보기: 마지막으로 본 영상을 마지막 위치부터 재생한다 (완료 조건)
  - 시청 완료는 서버가 정한다(본 시간 90% 이상, #20). 화면은 저장 뒤 강의 정보를 다시 받아 목차에 표시한다
  - 학습 순서: 시청 전 테스트(OX, API 39·40) → 영상 → 최종 퀴즈(API 41·42). 잠긴 단계는 목차에서 흐리게 표시(NFR-09, #53)
  - 콘텐츠 탭 '강의 문의'(#55): 이 강의의 문의 목록·작성·답변 (API 47~52, inquiry-board.js)
*/-->
<div class="mb-shell">
  <th:block th:replace="~{fragments/layout/sidebar :: sidebarFragment('lectures')}"></th:block>

    <header th:replace="~{fragments/layout/header :: headerFragment}"></header>

      <div class="lec-detail" data-lec-detail>
        <a class="lec-back" href="/user/lectures" data-lec-back>← 강의 목록</a>

          <div class="lec-state">강의를 불러오는 중이에요…</div>
        </div>
      </div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/course-common.js}"></script>
