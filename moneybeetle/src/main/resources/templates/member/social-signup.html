<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragments/layout/header :: headFragment('소셜 회원가입')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page" data-auth-page="social-signup">
<main class="auth-main">
  <a class="auth-brand" th:href="@{/}" aria-label="머니비틀 홈"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
  <section class="auth-card auth-card--wide" aria-labelledby="social-title">
    <span class="auth-eyebrow">마지막 한 걸음</span>
    <h1 id="social-title">가입 정보를 입력해 주세요</h1>
    <p class="auth-lead">소셜 계정 확인이 끝났어요. 필요한 정보를 마저 입력하면 가입돼요.</p>
    <form id="social-signup-form" class="auth-form" novalidate>
      <label for="social-provider">가입 방법</label>
      <input id="social-provider" readonly aria-readonly="true">
      <label for="social-email">이메일</label>
      <input id="social-email" type="email" readonly aria-readonly="true">
      <label for="social-nickname">닉네임</label>
      <div class="auth-inline">
        <input id="social-nickname" maxlength="12" autocomplete="nickname" required placeholder="2~12자, 한글·영문·숫자">
        <button class="auth-button auth-button--secondary" id="social-check-nickname" type="button">중복 확인</button>
      </div>
      <label for="social-birth">생년월일</label>
      <input id="social-birth" type="date" required autocomplete="bday">
      <label for="social-gender">성별 <span class="auth-optional">선택</span></label>
      <select id="social-gender">
        <option value="">선택 안 함</option>
        <option value="FEMALE">여성</option>
        <option value="MALE">남성</option>
      </select>
      <div id="social-terms" class="auth-terms"></div>
      <p class="auth-message" id="social-signup-message" role="alert" aria-live="polite"></p>
      <button class="auth-button auth-button--primary" type="submit">가입 완료</button>
    </form>
  </section>
</main>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
