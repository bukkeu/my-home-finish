<!DOCTYPE html>

  <link rel="stylesheet" type="text/css" th:href="@{/css/instructor.css}">
</head>
<body class="ins-auth-body">
<!--/* comment.
  담당 : DBA ① 신아림 (#59, 강사 가입 화면)
  원본 디자인 : InstructorSignup.dc.html (화면설계 5.1.4)
  경로 : /instructor/signup (누구나)
  데이터 : POST /api/v1/auth/identity-verification/request·/identity-verification (본인인증, API 5-1·5),

  - 단계: 이메일 인증 → 비밀번호 → 약관 동의 → 강사 정보 → 신청 완료(관리자 승인 안내 → 강사 로그인)

*/-->
<div class="ins-auth">
  <main class="ins-auth__card ins-auth__card--wide">
    <a class="ins-auth__logo" th:href="@{/}"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>

    <span class="ins-kicker">강사 회원가입</span>

    <div data-ins-signup aria-live="polite"></div>
