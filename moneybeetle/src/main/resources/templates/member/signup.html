<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout/header :: headFragment('회원가입')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-page" data-auth-page="signup">
<main class="auth-main auth-main--signup">
    <a class="auth-brand" th:href="@{/}" aria-label="머니비틀 홈"><img th:src="@{/images/logo.png}" alt="Money Beetle"></a>
    <section class="auth-card auth-card--wide" aria-labelledby="signup-title">
        <div class="auth-steps" aria-label="가입 진행 단계">
            <span class="is-active" data-step-indicator="1">이메일 인증</span><span data-step-indicator="2">계정 정보</span><span data-step-indicator="3">약관 동의</span><span data-step-indicator="4">프로필</span>
        </div>
        <h1 id="signup-title">머니비틀 회원가입</h1>
        <p class="auth-lead">이메일 인증을 마친 뒤 가입 정보를 입력해 주세요.</p>
        <div class="auth-panel" data-signup-step="1">
            <label for="signup-email">이메일</label>
            <div class="auth-inline"><input id="signup-email" type="email" autocomplete="email" maxlength="100" required placeholder="beetle@example.com"><button class="auth-button auth-button--secondary" id="request-code" type="button">인증번호 받기</button></div>
            <p class="auth-hint">인증번호는 5분 동안 유효해요. 다시 보내기는 60초 후에 할 수 있어요.</p>
            <label for="signup-code">인증번호 6자리</label>
            <div class="auth-inline"><input id="signup-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" disabled><button class="auth-button auth-button--secondary" id="verify-code" type="button" disabled>인증 확인</button></div>
            <p class="auth-message" id="signup-email-message" role="status" aria-live="polite"></p>
            <button class="auth-button auth-button--primary" id="signup-next-1" type="button" disabled>다음</button>
            <div th:if="${googleOAuthEnabled} or ${kakaoOAuthEnabled}">
                <div class="auth-divider"><span>또는 간편하게 시작하기</span></div>
                <div class="auth-social">
                    <a class="auth-button auth-button--google" th:if="${googleOAuthEnabled}" th:href="@{/api/v1/auth/oauth/google}"><span aria-hidden="true">G</span>Google로 계속하기</a>
                    <a class="auth-button auth-button--kakao" th:if="${kakaoOAuthEnabled}" th:href="@{/api/v1/auth/oauth/kakao}"><span aria-hidden="true">●</span>카카오로 계속하기</a>
                </div>
            </div>
        </div>
        <div class="auth-panel" data-signup-step="2" hidden>
            <label for="signup-password">비밀번호</label>
            <div class="auth-password"><input id="signup-password" type="password" autocomplete="new-password" minlength="8" maxlength="20" placeholder="8~20자, 영문과 숫자 포함"><button type="button" data-password-toggle="signup-password">보기</button></div>
            <p class="auth-hint">영문과 숫자를 함께 사용해 주세요.</p>
            <label for="signup-password-confirm">비밀번호 확인</label>
            <input id="signup-password-confirm" type="password" autocomplete="new-password" maxlength="20">
            <p class="auth-message" id="signup-password-message" role="alert" aria-live="polite"></p>
            <div class="auth-actions"><button class="auth-button auth-button--secondary" data-signup-back="1" type="button">이전</button><button class="auth-button auth-button--primary" id="signup-next-2" type="button">다음</button></div>
        </div>
        <div class="auth-panel" data-signup-step="3" hidden>
            <div class="auth-terms-head"><h2>약관에 동의해 주세요</h2><button type="button" id="agree-all">전체 동의</button></div>
            <div id="signup-terms" class="auth-terms"><p class="auth-hint">약관을 불러오는 중이에요.</p></div>
            <p class="auth-message" id="signup-terms-message" role="alert" aria-live="polite"></p>
            <div class="auth-actions"><button class="auth-button auth-button--secondary" data-signup-back="2" type="button">이전</button><button class="auth-button auth-button--primary" id="signup-next-3" type="button">다음</button></div>
        </div>
        <div class="auth-panel" data-signup-step="4" hidden>
            <label for="signup-nickname">닉네임</label>
            <div class="auth-inline"><input id="signup-nickname" maxlength="12" autocomplete="nickname" placeholder="2~12자, 한글·영문·숫자"><button class="auth-button auth-button--secondary" id="check-nickname" type="button">중복 확인</button></div>
            <label for="signup-birth">생년월일</label>
            <input id="signup-birth" type="date" autocomplete="bday">
            <label for="signup-gender">성별 <span class="auth-optional">선택</span></label>
            <select id="signup-gender"><option value="">선택 안 함</option><option value="FEMALE">여성</option><option value="MALE">남성</option></select>
            <p class="auth-hint">가입하면 청약통장이 자동으로 만들어져요 (가상 실습용).</p>
            <p class="auth-message" id="signup-profile-message" role="alert" aria-live="polite"></p>
            <div class="auth-actions"><button class="auth-button auth-button--secondary" data-signup-back="3" type="button">이전</button><button class="auth-button auth-button--primary" id="signup-submit" type="button">가입 완료</button></div>
        </div>
        <p class="auth-bottom">이미 계정이 있나요? <a th:href="@{/login}">로그인</a></p>
    </section>
</main>
<footer class="auth-footer">가입하면 캐시와 경험치를 모으며 경제 공부를 이어갈 수 있어요.</footer>
<th:block th:replace="~{fragments/layout/header :: scriptsFragment}"></th:block>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
