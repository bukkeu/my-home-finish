# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# MoneyBeetle(MY-HOME) 팀 CodeRabbit 설정
# 기술 스택: Java 21 · Spring Boot 3.5 · MySQL 8 · JPA · Thymeleaf · Spring Security 6(세션 로그인)
# 저장소 구조: moneybeetle/(Spring 서버) · moneybeetle-page/(HTML 프로토타입) · 기능/(명세 문서)
# 리뷰 초점: 역할과 책임 분리, 도메인 분리, 캐시·자산 정합성, 유지보수성

language: "ko-KR"
tone_instructions: "리뷰 대상은 Java·Spring(JPA, Security, Thymeleaf)을 배우는 부트캠프 수강생입니다. 쉬운 한국어로 왜 문제인지와 고친 코드 예시를 함께 보여 주세요. 전문 용어는 한글(영어)로 병기하고, 지금 필요 없는 과한 추상화는 제안하지 마세요."
early_access: false

reviews:
  profile: "chill"                   # quiet / chill / assertive
  high_level_summary: true           # PR 설명에 변경 요약 추가
  high_level_summary_instructions: |
    맨 첫 줄에 "변경 도메인: course, growth"처럼 이 PR이 수정한 com.wanted.moneybeetle.domain 하위 패키지를 적는다. global을 고쳤으면 global도 적는다.
    둘째 줄에 PR 설명의 "Closes #번호"에서 찾은 관련 이슈 번호를 적는다. 없으면 "관련 이슈: 없음"이라고 적는다.
    이어서 변경 내용을 한국어 글머리표 3~5개로 요약한다.
  collapse_walkthrough: false        # 변경 설명(Walkthrough)을 펼친 상태로 표시
  sequence_diagrams: true            # 요청 흐름을 시퀀스 다이어그램으로 표시
  estimate_code_review_effort: true
  review_status: true
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true  # Claude Code에 붙여 넣을 수정 프롬프트 제공

  auto_review:
    enabled: true
    drafts: false                    # Draft PR은 리뷰하지 않음
    base_branches:                   # 기본 브랜치 외에 리뷰할 대상 브랜치 (Git 규칙: 작업 브랜치 → dev → main)
      - "^dev$"
      - "^main$"
    ignore_title_keywords:
      - "WIP"

  path_filters:                      # 리뷰에서 뺄 파일
    # 빌드 결과물·IDE 설정
    - "!**/build/**"
    - "!**/out/**"
    - "!**/.gradle/**"
    - "!**/gradle/wrapper/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/.idea/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    # 실제 서비스 화면은 templates(Thymeleaf)로 옮기므로, 프로토타입 HTML은 리뷰하지 않는다
    - "!moneybeetle-page/**"
    # 이미지·압축 파일
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.zip"

  path_instructions:
    # ── 1. 모든 Java 코드: 설계 기준 ──
    - path: "moneybeetle/src/main/java/**/*.java"
      instructions: |
        [역할과 책임]
        - 한 클래스나 메소드가 여러 일을 하면(예: 검증 + 저장 + 화면 데이터 가공) 어디로 나누면 좋을지 제안한다.
        - 의존 방향은 Controller → Service → Repository 한 방향이어야 한다. 거꾸로 의존하거나 계층을 건너뛰면 지적한다.
        [도메인 분리 · 협업]
        - 패키지는 com.wanted.moneybeetle.domain 아래 도메인(auth, member, inquiry, operation, course, quiz, growth, home, term, notification, housing, trading) 단위로 나누고, 공통 코드는 global에 둔다.
        - 도메인 안의 구조는 controller / model/dao / model/dto / model/entity / model/service / exception 으로 통일한다. 다른 위치에 두면 지적한다.
        - 관리자·강사용 기능도 해당 도메인 안에 둔다(예: course.controller.AdminCourseController).
        - 다른 도메인의 Repository나 Entity를 직접 수정하는 코드는 지적하고, 그 도메인의 Service 메소드를 통해 요청하도록 안내한다.
        - 다음 공통 기능은 반드시 지정된 Service로만 처리한다. 직접 구현하거나 Repository를 쓰면 [필수]로 지적한다.
          · 캐시·경험치 지급/차감: growth.RewardService
          · 알림 생성: notification.NotificationService
          · 관리자 작업 기록: operation.AdminLogService
        - 에러 코드는 도메인별 enum(XxxErrorCode)에 추가한다. global의 CommonErrorCode에 도메인 전용 코드를 넣으면 지적한다.
        - 도메인끼리 서로를 참조하는 순환 의존(A → B → A)을 지적한다.
        - global에 특정 도메인 전용 로직이 들어가면 해당 도메인으로 옮기도록 안내한다.
        [유지보수]
        - 중복 코드, 설명 없는 숫자·문자열(매직 넘버)은 메소드 추출, 상수, Enum으로 바꾸도록 제안한다.
        - 캐시·경험치 지급액, 해금 레벨(모의투자 Lv.8, 모의 청약 Lv.12), 퀴즈 통과 점수, 이월 비율 같은 운영 값은 코드에 고정하지 않고 설정 테이블(operation)이나 보상 규칙에서 읽도록 안내한다.
        - 깊은 if 중첩은 조기 반환(early return)으로 줄이도록 제안한다.
        - 이름은 역할을 드러내야 한다. 주석은 한글, 변수명·메소드명은 영어 camelCase, 클래스명은 PascalCase.
        - System.out.println 디버깅 출력이 남아 있으면 Logger 사용을 안내한다.
        [시간 기준]
        - "오늘" 판단(출석, 청약 납입, 휴장일, 공고 상태)은 Asia/Seoul 기준 공통 시계 클래스로만 한다. LocalDate.now()·LocalDateTime.now()를 곳곳에서 직접 부르면 지적한다.
        [확장성]
        - 상태나 타입이 늘 때마다 if·switch를 고쳐야 하는 구조면 Enum에 동작을 담는 방식 등을 제안한다.
        - 강의 상태(작성 중→검수 중→허가/반려), 시즌 상태(준비→진행 중→휴장→정산→종료)는 허용된 다음 단계로만 바뀌는지 확인한다.
        - 단, 지금 요구사항에 필요 없는 인터페이스·추상 클래스·디자인 패턴은 제안하지 않는다.
        [더 나은 방법 제안]
        - 동작에 문제가 없는 코드라도 더 읽기 쉽고 관리하기 좋은 방법이 있으면 함께 알려 준다. 예: 직접 만든 입력 검증 → Bean Validation(@NotBlank 등), 단순 반복문 → Stream, 직접 구현한 페이징 → Pageable, 반복되는 예외 처리 → @ControllerAdvice.
        - 제안할 때는 현재 코드와 개선 코드를 나란히 보여 주고, 무엇이 좋아지는지(가독성, 유지보수, 성능, 안전성) 한 줄로 설명한다.
        - 반드시 고쳐야 하는 문제는 "[필수]", 선택해도 되는 개선은 "[제안]"으로 시작해 구분한다. (팀 리뷰 규칙과 같은 말머리)
        - 수업 범위를 크게 벗어나는 기술(QueryDSL, 메시지 큐, Redis 등)을 새로 도입하라고 제안하지 않는다.

    # ── 2. 계층·기술별 기준 ──
    - path: "moneybeetle/src/main/java/**/controller/*Controller.java"
      instructions: |
        - Controller는 요청 받기, 입력 검증, Service 호출, 뷰 이름이나 응답 반환만 한다. 비즈니스 로직과 Repository 직접 호출은 Service로 옮기도록 안내한다.
        - 화면 Controller(Thymeleaf)와 /api/v1 REST Controller를 구분한다. REST 응답은 global의 ApiResponse(목록은 PageResponse) 형식을 쓰는지 확인한다.
        - 폼·요청 본문은 Entity가 아닌 요청 DTO로 받고 @Valid로 검증한다. Entity로 받으면 role, cash 같은 필드를 사용자가 조작할 수 있는 위험을 설명한다.
        - Model이나 응답에 Entity를 그대로 담지 말고 DTO로 변환하도록 안내한다.
        - 본인 데이터(오답노트·캐시·거래·청약 내역)는 주소의 회원 ID가 아니라 로그인 세션의 회원 ID로 조회해야 한다. @PathVariable memberId로 본인 데이터를 조회하면 [필수]로 지적한다.
        - 화면 폼의 등록·수정 POST 처리 뒤에는 redirect로 응답해 새로고침 중복 제출을 막는다(PRG 패턴).
    - path: "moneybeetle/src/main/java/**/model/service/*.java"
      instructions: |
        - 비즈니스 규칙과 권한 확인(예: 본인 글만 수정, 본인 강의만 수정, 레벨 해금 여부)은 Service에서 DB 값으로 확인한다. 화면의 블러·잠금 표시만 믿으면 지적한다.
        - 클래스에 @Transactional(readOnly = true), 데이터를 바꾸는 메소드에 @Transactional을 붙이는 구성을 확인한다.
        - 매수·매도, 보상 지급, 시즌 참가, 시즌 정산, 청약통장 납입, 당첨 산정, 퀴즈 제출→학습 완료→보상은 각각 하나의 트랜잭션이어야 한다. 중간에 나뉘어 일부만 저장될 수 있으면 [필수]로 지적한다.
        - 잔액·보유 수량을 바꿀 때 동시 요청으로 음수가 될 수 있으면 비관적 락이나 조건부 업데이트를 안내한다.
        - 같은 활동으로 캐시·경험치가 두 번 지급될 수 있는 흐름(재제출, 새로고침, 두 탭)을 찾아 지적한다.
        - 지난 턴 가격·뉴스, 체결된 거래, 지급 내역을 UPDATE·DELETE하면 지적하고, 반대 내역(회수)을 추가하는 방식을 안내한다.
        - 생성자 주입(final 필드 + @RequiredArgsConstructor)을 사용하고 필드 주입(@Autowired 필드)은 지적한다.
        - Optional.get() 대신 orElseThrow로 도메인 ErrorCode를 담은 BusinessException을 던지도록 안내한다.
        - 하나의 Service가 여러 도메인의 일을 떠안고 커지면 분리를 제안한다.
    - path: "moneybeetle/src/main/java/**/model/dao/*Repository.java"
      instructions: |
        - Spring Data JPA 메소드 이름 규칙과 @Query 사용이 적절한지 확인한다. @Query에 문자열을 더해 조건을 만들면 SQL 인젝션 위험을 설명하고 파라미터 바인딩을 안내한다.
        - 목록 조회에서 연관 엔티티를 반복 조회하는 N+1 문제 가능성이 보이면 fetch join이나 @EntityGraph를 안내한다.
        - 다른 도메인 Service에서 이 Repository를 직접 주입받아 쓰면 지적한다.
    - path: "moneybeetle/src/main/java/**/model/entity/*.java"
      instructions: |
        - @Setter와 @Data 대신 의미 있는 변경 메소드(예: changeTitle)로 상태를 바꾸게 한다.
        - 기본 생성자는 @NoArgsConstructor(access = AccessLevel.PROTECTED)로 막는다.
        - @ManyToOne, @OneToOne은 fetch = FetchType.LAZY를 권장한다. 양방향 연관관계는 꼭 필요할 때만 쓴다.
        - Enum 필드는 @Enumerated(EnumType.STRING)을 사용한다.
        - 생성·수정 시각은 global의 BaseTimeEntity를 상속해 쓴다.
        - 강의·회원은 삭제 대신 상태 값(비공개·탈퇴)으로 바꾸는지 확인한다.
        - 테이블·컬럼은 resources/sql 스크립트와 일치해야 한다(ddl-auto none). Entity만 바꾸고 SQL을 안 바꾸면 알린다.
        - Entity가 DTO, Controller, 화면 코드에 의존하지 않는지 확인한다.
    - path: "moneybeetle/src/main/java/**/model/dto/*.java"
      instructions: |
        - 요청 DTO와 응답 DTO를 나누고, 응답에 비밀번호·비밀번호 재설정 토큰 같은 민감 정보가 들어가지 않게 한다.
        - 퀴즈 문제를 내려 주는 응답 DTO에 정답·해설이 들어 있으면 [필수]로 지적한다(제출 전 정답 노출).
        - 다른 회원에게 보이는 프로필 DTO에 생년월일·성별·이메일이 들어 있으면 지적한다.
        - Entity ↔ DTO 변환 위치(예: 정적 팩토리 메소드 from)가 팀 안에서 일관적인지 확인한다.
    - path: "moneybeetle/src/main/java/**/auth/**/*.java"
      instructions: |
        - SecurityFilterChain 빈으로 설정하는지 확인한다. Spring Security 6에서 제거된 WebSecurityConfigurerAdapter 방식은 지적한다.
        - 로그인은 세션 방식이다. JWT나 localStorage에 역할·토큰을 저장하는 방식으로 바꾸면 이유를 묻는다.
        - 비밀번호는 PasswordEncoder(BCrypt)로 암호화해 저장하고 비교한다. 비밀번호를 로그에 남기면 지적한다.
        - requestMatchers 권한 규칙을 확인한다: /admin/**·/api/v1/admin/**는 ADMIN, /instructor/**·/api/v1/instructor/**는 승인된 INSTRUCTOR. 좁은 규칙이 넓은 규칙보다 앞에 있는지, permitAll이 너무 넓지 않은지 본다.
        - 로그인 성공 시 세션 ID를 새로 발급하는지, 연속 5회 실패 시 잠금 처리가 실패 핸들러에 있는지 확인한다.
        - CSRF는 켜 두는 것이 팀 정책이다. 비활성화했다면 [필수]로 이유를 묻는다. Thymeleaf 폼(th:action)은 CSRF 토큰을 자동으로 넣어 준다.
    - path: "moneybeetle/src/main/java/**/global/**/*.java"
      instructions: |
        - global은 모든 도메인이 쓰는 코드만 둔다(config, common, exception, security, file). 특정 도메인 전용 로직이 있으면 그 도메인으로 옮기도록 안내한다.
        - 파일 업로드는 확장자가 아니라 파일 내용으로 형식을 확인하고, 용량 제한과 UUID 파일명을 쓰는지 확인한다.

    # ── 3. 화면 · 설정 · SQL · 테스트 ──
    - path: "moneybeetle/src/main/resources/templates/**/*.html"
      instructions: |
        - th:utext는 XSS 위험이 있으므로 쓰지 않는다(팀 정책). 사용자가 쓴 글(요약글·문의)도 th:text로 출력하게 한다.
        - 계산이나 복잡한 조건 같은 비즈니스 로직은 템플릿이 아닌 Service나 DTO에서 처리하게 한다.
        - 반복되는 헤더·사이드바·드로어 마크업은 templates/fragments의 th:fragment와 th:replace로 공통 레이아웃에 분리하게 한다.
        - sec:authorize와 레벨 블러 표시는 화면 표시만 제어한다. 서버의 권한·레벨 검사도 있어야 함을 알려 준다.
        - 모의투자·모의 청약 화면에는 "가상 실습이며 실제 금융 거래가 아님" 문구가 있어야 한다(NFR-12).
    - path: "moneybeetle/src/main/resources/static/js/**/*.js"
      instructions: |
        - 역할·레벨·세션 정보를 localStorage에 저장하거나 그 값으로 권한을 판단하면 [필수]로 지적한다. 서버 세션과 Model 값을 쓰게 한다.
        - fetch로 POST·PUT·PATCH·DELETE를 보낼 때 CSRF 토큰을 헤더에 담는지 확인한다.
        - 사용자 입력을 innerHTML로 넣으면 XSS 위험을 설명하고 textContent를 안내한다.
        - 제출 버튼은 요청 중 비활성화해 연타로 인한 중복 요청을 막는다.
    - path: "moneybeetle/src/main/resources/**/application*.{yml,yaml,properties}"
      instructions: |
        - DB 비밀번호, OAuth 키, 메일 비밀번호, 스토리지 키가 값으로 직접 들어 있으면 반드시 지적하고 환경 변수로 분리하게 한다.
        - spring.jpa.hibernate.ddl-auto는 none이어야 한다(테이블은 resources/sql 스크립트로 생성). create나 create-drop이면 팀 공용 DB 데이터가 지워질 수 있음을 알린다.
        - 시간대는 Asia/Seoul, 세션 타임아웃 30분, 업로드 최대 2MB가 유지되는지 확인한다.
    - path: "moneybeetle/src/main/resources/sql/**/*.sql"
      instructions: |
        - SQL은 번호 파일(01_member.sql 등)로 도메인별로 나누고 DBA가 관리한다. 다른 도메인의 테이블을 다른 번호 파일에서 바꾸면 알린다.
        - 중복 지급 방지(활동 종류 + 대상 ID), 하루 1회 납입(회원 + 날짜), 같은 단지 중복 청약 같은 규칙은 유니크 제약으로 DB에서도 막는지 확인한다.
        - 금액 컬럼은 소수 오차가 없는 타입(BIGINT 등)을 쓰는지 확인한다.
        - 테이블이 바뀌면 기능/MoneyBeetle_DB설계.md도 같은 PR에서 고쳐야 함을 알린다.
    - path: "moneybeetle/src/test/**/*.java"
      instructions: |
        - 테스트 이름이 무엇을 검증하는지 드러나는지, 실패·예외 경우도 검증하는지 확인한다.
        - 캐시 이중 지급, 이전 턴 가격 주문 거절, 하루 2회 납입 거절처럼 정합성 규칙은 실패 경우 테스트가 있는지 확인한다.
        - 날짜에 따라 결과가 바뀌는 테스트는 시계 클래스를 고정해서 쓰도록 안내한다.

  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "'타입(영역): 한글 요약 (#이슈번호)' 형식. 타입은 feat, fix, docs, refactor, style, test, chore 중 하나. 영역은 fe, be, docs 중 하나이고 생략할 수 있다. 요약은 50자 안팎이며 마침표로 끝나지 않는다. 이슈번호는 이슈가 없는 문서 작업과 dev → main 릴리스 PR이면 생략할 수 있다. 예: feat(be): 퀴즈 제출·채점 API 추가 (#19)"
    description:
      mode: "warning"
    docstrings:
      mode: "off"                     # 주석 커버리지 경고는 끔
    custom_checks:
      - name: "계층 의존 방향"
        mode: "warning"
        instructions: |
          변경된 Controller 클래스가 Repository를 직접 주입받거나 호출하면 실패.
          Controller는 Service만 호출해야 한다. 변경된 Controller가 없으면 통과.
      - name: "도메인 범위"
        mode: "warning"
        instructions: |
          변경된 Java 파일이 global을 제외한 com.wanted.moneybeetle.domain 하위 패키지 2개 이상에 걸쳐 있고, PR 설명에 여러 도메인을 함께 수정한 이유가 없으면 실패.
          또한 한 도메인의 Service가 다른 도메인의 Repository를 주입받으면 실패.
          도메인 1개만 수정했거나 이유가 적혀 있고 다른 도메인 Repository를 쓰지 않으면 통과.
      - name: "캐시·경험치 변경 경로"
        mode: "warning"
        instructions: |
          growth 도메인 밖의 코드가 CashHistory·ExpHistory 저장소나 회원의 캐시·경험치 값을 직접 바꾸면 실패.
          캐시·경험치 변경은 growth.RewardService 메소드를 호출해야 한다. 관련 변경이 없으면 통과.
      - name: "비밀번호 암호화"
        mode: "warning"
        instructions: |
          회원 비밀번호를 저장하거나 변경하는 코드가 바뀌었는데 PasswordEncoder로 인코딩하지 않으면 실패.
          관련 코드 변경이 없으면 통과.
      - name: "이슈·명세서 연결"
        mode: "warning"
        instructions: |
          PR 설명에 "Closes #번호"가 없으면 실패. 단, dev → main 릴리스 PR과 docs 타입 PR은 예외로 통과.
          Controller의 /api/v1 주소나 resources/sql 파일이 바뀌었는데 기능/MoneyBeetle_API명세서.md 또는 기능/MoneyBeetle_DB설계.md가 함께 바뀌지 않았으면 실패.
          해당 사항이 없으면 통과.

  tools:
    pmd:
      enabled: true                  # Java 정적 분석
    gitleaks:
      enabled: true                  # 비밀번호·키 유출 탐지
    languagetool:
      enabled: false                 # 영어 문법 지적은 끔
    markdownlint:
      enabled: false                 # 명세 문서 서식 지적은 끔

chat:
  auto_reply: true
  allow_non_org_members: false       # 팀(조직) 멤버만 CodeRabbit과 대화 가능

code_generation:
  docstrings:
    language: "ko-KR"                # Javadoc 생성 시 한국어
