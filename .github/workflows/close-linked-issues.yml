name: Close linked issues on merge

# GitHub closes "Closes #N" issues only when a PR merges into the default branch.
# This workflow closes them for PRs merged into any branch (e.g. dev).
on:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ""}`
              .replace(/<!--[\s\S]*?-->/g, "");
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)/gi;
            const numbers = [...new Set([...text.matchAll(re)].map(m => Number(m[1])))];
            for (const issue_number of numbers) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request || issue.state === "closed") continue;
              await github.rest.issues.update({ ...context.repo, issue_number, state: "closed", state_reason: "completed" });
              core.info(`Closed #${issue_number}`);
            }
