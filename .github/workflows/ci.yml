name: BE build & test

# PR(dev·main 대상)과 dev·main 에 합쳐질 때 Spring 서버를 빌드하고 테스트한다 (#67)
# 테스트는 DB 없이 돈다. 서버 코드가 바뀐 경우에만 실행한다.
on:
  pull_request:
    branches: [dev, main]
    paths:
      - "moneybeetle/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "moneybeetle/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:                                  # 같은 PR 에 새 커밋이 오면 이전 실행은 취소
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moneybeetle
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: moneybeetle/build/reports/tests/test
          retention-days: 7
